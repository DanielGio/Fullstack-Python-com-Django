{% extends 'cadastro/base.html' %}

{% block titulo %}Cadastro - Faça Contato{% endblock %}

{% block conteudo %}
<article>
    <h1>Contato</h1>

    {% if messages %}
        {% for mensagem in messages %}
            <p><strong>{{ mensagem }}</strong></p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar</button>
    </form>
</article>
{% endblock %}
