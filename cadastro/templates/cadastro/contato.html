{% extends 'cadastro/base.html' %}

{% block titulo %}Cadastro - Faça Contato{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body">
                <h2 class="h4 mb-4">Contato</h2>

                <form method="POST">
                    {% csrf_token %}
                    {% include 'cadastro/_form.html' %}
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
