{% extends 'cadastro/base.html' %}

{% block titulo %}Cadastro - Apagar {{ pessoa.nome }}{% endblock %}

{% block conteudo %}

<article>
    <h2>Apagar {{ pessoa.nome }}?</h2>
    <p>Essa ação não pode ser desfeita!</p>

       <form method="POST">
        {% csrf_token %}
        <div class="acoes">
            <button type="submit" class="botao-perigo">Confirmar</button>
            <a class="botao botao-secundario" href="{% url 'detalhes' id=pessoa.id %}">Cancelar</a>
        </div>
    </form>
</article>

{% endblock %}
